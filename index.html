<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gofile0 - ファイル共有</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto space-y-6">
        <!-- ヘッダー -->
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl flex justify-between items-center">
            <div>
                <h1 id="folderTitle" class="text-xl font-bold text-emerald-400">読み込み中...</h1>
                <p class="text-xs text-slate-400 mt-1">Gofile0 ファイル共有ストレージ</p>
            </div>
        </div>

        <!-- ファイル一覧・プレイヤー -->
        <div id="fileListSection" class="space-y-4">
            <!-- ファイルがここに表示されます -->
        </div>
    </div>

    <script>
        const WORKER_URL = "https://gofile0-worker.newssokuhou.workers.dev";
        
        // URLの ? 以降からフォルダIDを取得
        const folderId = window.location.search.substring(1);

        async function loadSharedFolder() {
            if (!folderId) {
                document.getElementById('folderTitle').textContent = "フォルダが指定されていません";
                return;
            }

            try {
                const res = await fetch(`${WORKER_URL}/api/share/${folderId}`);
                if (!res.ok) throw new Error("フォルダが見つからないか、削除された可能性があります");
                
                const data = await res.json();
                document.getElementById('folderTitle').textContent = `📁 ${data.folder.name}`;

                const list = document.getElementById('fileListSection');
                list.innerHTML = '';

                if (data.files.length === 0) {
                    list.innerHTML = '<div class="bg-slate-800 p-6 rounded-xl border border-slate-700 text-center text-slate-400">ファイルはありません</div>';
                    return;
                }

                data.files.forEach(file => {
                    const fileUrl = `${WORKER_URL}/file/${encodeURIComponent(file.r2_key)}`;
                    let previewHtml = '';

                    if (file.mime_type && file.mime_type.startsWith('video/')) {
                        previewHtml = `<video controls class="w-full rounded bg-black max-h-[400px] mt-2"><source src="${fileUrl}" type="${file.mime_type}">お使いのブラウザは動画タグに対応していません。</video>`;
                    } else if (file.mime_type && file.mime_type.startsWith('image/')) {
                        previewHtml = `<img src="${fileUrl}" class="w-full rounded mt-2 max-h-[400px] object-contain bg-black/50">`;
                    } else if (file.mime_type && file.mime_type.startsWith('audio/')) {
                        previewHtml = `<audio controls class="w-full mt-2"><source src="${fileUrl}" type="${file.mime_type}">お使いのブラウザは音声タグに対応していません。</audio>`;
                    }

                    list.innerHTML += `
                        <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-3 shadow-lg">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-slate-200 truncate mr-2">${file.name}</span>
                                <a href="${fileUrl}" download="${file.name}" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 text-xs font-medium rounded transition shrink-0">ダウンロード</a>
                            </div>
                            ${previewHtml}
                        </div>
                    `;
                });

            } catch (err) {
                document.getElementById('folderTitle').textContent = "エラー";
                document.getElementById('fileListSection').innerHTML = `<div class="bg-slate-800 p-6 rounded-xl border border-slate-700 text-center text-red-400">${err.message}</div>`;
            }
        }

        loadSharedFolder();
    </script>
</body>
</html>
