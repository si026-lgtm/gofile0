<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gofile0 - ファイル共有</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-2xl bg-slate-800 rounded-xl shadow-2xl p-6 border border-slate-700">
        <h1 id="folderName" class="text-2xl font-bold mb-4 text-emerald-400">フォルダ読み込み中...</h1>
        <div id="fileList" class="space-y-3">
            <!-- ファイル一覧がここに表示されます -->
        </div>
    </div>

    <script>
        const WORKER_URL = "https://gofile0-worker.newssokuhou.workers.dev"; // あなたのWorker URL

        async function loadFolder() {
            const pathParts = window.location.search.replace('?', '').split('/');
            const folderId = pathParts[0] || new URLSearchParams(window.location.search).get('f');

            if (!folderId) {
                document.getElementById('folderName').textContent = "フォルダが指定されていません";
                return;
            }

            try {
                const res = await fetch(`${WORKER_URL}/api/share/${folderId}`);
                if (!res.ok) throw new Error("フォルダが見つかりません");
                const data = await res.json();

                document.getElementById('folderName').textContent = `📁 ${data.folder.name}`;
                const list = document.getElementById('fileList');
                list.innerHTML = '';

                if (data.files.length === 0) {
                    list.innerHTML = '<p class="text-slate-400 text-center py-4">ファイルはありません</p>';
                    return;
                }

                data.files.forEach(file => {
                    const item = document.createElement('div');
                    item.className = "bg-slate-700/50 p-4 rounded-lg flex items-center justify-between border border-slate-600";
                    
                    const isMedia = file.mime_type.startsWith('video/') || file.mime_type.startsWith('audio/') || file.mime_type.startsWith('image/');
                    
                    item.innerHTML = `
                        <div class="truncate mr-4">
                            <p class="font-medium text-slate-200 truncate">${file.name}</p>
                            <span class="text-xs text-slate-400">${(file.size / (1024*1024)).toFixed(2)} MB</span>
                        </div>
                        <div class="flex gap-2 shrink-0">
                            ${isMedia ? `<a href="${WORKER_URL}/file/${file.r2_key}" target="_blank" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-sm rounded-md transition">再生・表示</a>` : ''}
                            <a href="${WORKER_URL}/file/${file.r2_key}" download="${file.name}" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-sm rounded-md transition">ダウンロード</a>
                        </div>
                    `;
                    list.appendChild(item);
                });
            } catch (err) {
                document.getElementById('folderName').textContent = "エラーが発生しました";
                document.getElementById('fileList').innerHTML = `<p class="text-red-400 text-center py-4">${err.message}</p>`;
            }
        }

        loadFolder();
    </script>
</body>
</html>
